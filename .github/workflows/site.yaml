name: Build site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # note dates come from git history
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Point the site URL and footer link at whoever owns this repo, so a fork or transfer
      # needs no config edits. Remove this step if you set up a custom domain.
      - name: Set site URL
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          sed -i "s|^  baseUrl: .*|  baseUrl: ${owner}.github.io/${{ github.event.repository.name }}|" quartz.config.yaml
          sed -i "s|^        Source: .*|        Source: ${{ github.server_url }}/${{ github.repository }}|" quartz.config.yaml
          grep -E "baseUrl|Source:" quartz.config.yaml
      - run: npm run site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
