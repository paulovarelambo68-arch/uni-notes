name: Build site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Cloudflare Pages project: the site is at https://<name>.pages.dev
  CLOUDFLARE_PROJECT: galway-uni-notes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # note dates come from git history
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Point the site URL at the Cloudflare address and the footer link at whoever owns
      # this repo. Change the sed below if you set up a custom domain.
      - name: Set site URL
        run: |
          sed -i "s|^  baseUrl: .*|  baseUrl: ${CLOUDFLARE_PROJECT}.pages.dev|" quartz.config.yaml
          sed -i "s|^        Source: .*|        Source: ${{ github.server_url }}/${{ github.repository }}|" quartz.config.yaml
          grep -E "baseUrl|Source:" quartz.config.yaml
      - run: npm run site
      # Cloudflare Pages has no total size limit (GitHub Pages stops at 1 GB), only 20,000
      # files and 25 MiB per file on the free plan, and uploads only files that changed.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --yes wrangler@4 pages project list | grep -q "\b${CLOUDFLARE_PROJECT}\b"; then
            npx --yes wrangler@4 pages project create "$CLOUDFLARE_PROJECT" --production-branch main
          fi
          npx --yes wrangler@4 pages deploy public --project-name "$CLOUDFLARE_PROJECT" \
            --branch main --commit-dirty=true
      # The old github.io address only forwards to the Cloudflare site, keeping the path, so
      # links shared before the move still land on the same note. GitHub Pages serves 404.html
      # for every path it doesn't have, so that one page covers all of them.
      - name: Make the github.io redirect
        run: |
          mkdir redirect
          target="https://${CLOUDFLARE_PROJECT}.pages.dev"
          prefix="/${{ github.event.repository.name }}"
          cat > redirect/index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <title>Study Notes has moved</title>
          <meta http-equiv="refresh" content="0; url=${target}/">
          <link rel="canonical" href="${target}/">
          <script>
            var p = location.pathname.replace(/^${prefix//\//\\/}(?=\/|$)/, "");
            location.replace("${target}" + (p || "/") + location.search + location.hash);
          </script>
          <p>Study Notes has moved to <a href="${target}/">${target}</a>.</p>
          EOF
          cp redirect/index.html redirect/404.html
          cat redirect/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  # Publishes the redirect above at the old github.io address.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
