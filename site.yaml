# Build-time tweaks for the website. Nothing here modifies the notes in vault/.
#
# Each folder in vault/ is a subject. Inside it, the note with the same name as the
# folder (e.g. vault/Neurophysiology/Neurophysiology.md) is the index: its headings and
# links decide the sidebar structure and order. Notes not listed there go to "Concepts".

conceptsFolder: Concepts

subjects:
  Neurophysiology:
    # Page titles for notes whose file name is a phrase rather than a concept.
    # Links keep their original wording in the text; only the page title/URL changes.
    rename:
      "without decaying": "Non-decremental conduction"
      "Integrates": "Neural integration"
      "synthetic": "The soma as synthetic centre"
      "invaginates": "Invagination"
      "phosphorylates": "Phosphorylation"
      "refractory": "Refractory period"
      "woven": "Woven (Golgi tendon organ)"
      "shifts toward E_Na": "Why the AP peak approaches E_Na"
      "the dorsal column system crosses in the medulla; the anterolateral system crosses in the spinal cord": "Where the dorsal column and anterolateral systems cross"
      "Glia in Synaptogenesis and Syniaptic Activity": "Glia in Synaptogenesis and Synaptic Activity"
    # Fix typos in index headings.
    headings:
      "Neurotransmiters": "Neurotransmitters"
  Integrated Physiological Responses to Exercise:
    # Only these index sections go on the site for now (sync-notes.sh copies only their notes).
    # Add a section when it's ready, or delete the line to publish the whole subject.
    publish: [Immunology I, Immunology II]

# Audio tracks (scripts/narrate.mjs, npm run audio). Narration scripts live in
# audio/<Subject>/<Note>.md and pick a voice by the names below. Voices alternate between
# notes. "owner" is the voice-library owner id; with it, narrate.mjs adds a library voice to
# the account the first time it's needed. Find voices: npm run audio -- --find-voices irish female
audio:
  # eleven_v4 is ElevenLabs' highest-quality model (it sounded better than eleven_v3 here).
  model: eleven_v4
  # Pause between sections, in seconds (changing it rebuilds the tracks from the local cache).
  sectionPause: 0.8
  # Shown under the player. ElevenLabs' free plan requires crediting them.
  credit:
    text: Voice by ElevenLabs
    url: https://elevenlabs.io
  settings:
    stability: 0.5
    similarity_boost: 0.75
    style: 0.15
    use_speaker_boost: true
    speed: 1
  voices:
    # Irish voices from the ElevenLabs voice library, "Educational" category. `gain` (dB, steps of
    # 1.5, applied without re-encoding) evens out their loudness: with eleven_v4 Patrick's speech
    # measured 5.7 dB quieter, and his peaks leave room for only +1.5 dB. Changing it rebuilds the
    # tracks from the local cache.
    irish-female:
      name: Jessica Gallagher - Clear and Neutral
      id: DbwWo4rVEd5NrejHYUnm
      gain: -4.5
    irish-male:
      name: Patrick - Engaging and Warm
      id: qwaVDEGNsBllYcZO1ZOJ
      gain: 1.5
